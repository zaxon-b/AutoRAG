version: '3.8'
services:
  # FastAPI 后端：源码和评测目录通过 volume 挂载进容器，改代码后重启即可生效。
  swxy_api:
    build:
      context: ./app
      dockerfile: Dockerfile
    hostname: swxy_api
    container_name: swxy_api
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@gsk_pg:5432/gsk
      - ES_HOST=http://es01:9200
      - ELASTICSEARCH_URL=http://es01:9200
      - MANUAL_INDEX_NAME=manual_chunks_demo
      - DEMO_MANUAL_ID=demo_manual
      - ROOT_PATH=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ../evals:/app/evals
      - nltk_data:/usr/local/nltk_data
    entrypoint: ["sh", "/app/start.sh"]
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      - gsk_pg
      - es01
    networks:
      - gsk_network

  # 单节点 Elasticsearch；开启密码认证但关闭 TLS，仅用于本地开发。
  es01:
    container_name: gsk-es-01
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    volumes:
      - gsk_esdata01:/usr/share/elasticsearch/data
    env_file: .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure
    networks:
      - gsk_network

  # 开发用 PostgreSQL；数据卷持久化，首次启动时执行 init.sql。
  gsk_pg:
    container_name: gsk_pg
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=gsk
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - gsk_network

volumes:
  gsk_esdata01:
    driver: local
  pg_data:
    driver: local
  nltk_data:
    driver: local

networks:
  gsk_network:
    driver: bridge
